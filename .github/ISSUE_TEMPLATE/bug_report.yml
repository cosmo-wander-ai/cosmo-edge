name: Bug report
description: Report a reproducible problem in CosmoEdge.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CosmoEdge. Please search existing issues before filing a new one.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Describe the observed problem in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reproduces the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include logs, screenshots, or error messages when possible.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Runtime / engine
        - Web UI
        - Pipeline orchestration
        - Model porting
        - Documentation
        - Build / packaging
        - Deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share the platform and versions involved.
      value: |
        - CosmoEdge version or commit:
        - OS:
        - Hardware:
        - Browser:
        - Docker version:
        - Sophon SDK version:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or attachments
      description: Paste logs as text or attach screenshots/videos. Remove secrets, tokens, private URLs, and personal data first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions.
          required: true
        - label: I have removed secrets, private URLs, and personal data from the report.
          required: true
