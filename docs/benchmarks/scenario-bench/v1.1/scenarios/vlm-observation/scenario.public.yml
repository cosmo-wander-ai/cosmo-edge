version: 2
name: vlm-0p1fps-validated-performance
displayName: VLM 0.1 FPS validated performance
sampleIntervalSec: 3

channels:
  mode: local
  repeatCount: 0
  sources:
    - name: public-1080p24-sample
      file: "../../dataset/controlled-1080p24-sample.mp4"

tasks:
  - id: vlm-observation
    displayName: Vision-language model observation
    type: vlm
    modelRef: "../../models/<platform>.json#vlm"
    targetFps: 0.1

bindings:
  - task: vlm-observation
    channels: all

loadProfile:
  - channels: 1
    holdSec: 60
  - channels: 2
    holdSec: 60
  - channels: 3
    holdSec: 60
  - channels: 4
    holdSec: 60
  - channels: 5
    holdSec: 60
  - channels: 6
    holdSec: 60
  - channels: 7
    holdSec: 60
  - channels: 8
    holdSec: 60

thresholds:
  pass:
    avgDiscardRate: 0.05
    maxPacketDiscardRate: 0.01
    maxDiskUsedPercent: 99
  taskTypes:
    vlm:
      minFpsRatio: 0.8
      maxMissingRate: 0
      avgDiscardRate: 0.05

# Before each formal hold window, the newly added route must advance its
# task-local completion counter and expose direct Qwen latency. The 80% FPS
# threshold is an executed gate. The last passing level and the adjacent first
# gate failure form the short-run capacity boundary for the frozen candidate.
