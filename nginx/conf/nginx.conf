

user  root;
worker_processes  auto;

error_log  /data/cwaiuserdata/log/logs/nginx_error.log warn;
pid        nginx.pid;


events {
    worker_connections  35535;
    multi_accept on;
}

rtmp {

    server {

        listen 1935;
        chunk_size 4096;
        max_streams 100;
        ping 30s;
        ping_timeout 10s;

        # TV mode: one publisher, many subscribers
        application live {
        #       live on;#直播模式
        #       hls on;#这个参数把直播服务器改造成实时回放服务器。
        #       wait_key on; #对视频切片进行保护，这样就不会产生马赛克了。
        #       hls_path /dev/shm/hls; #切片视频文件存放位置。
        #       hls_fragment 3s; #每个视频切片的时长。
        #       hls_playlist_length 60s; #总共可以回看的事件，这里设置的是1分钟。
        #       hls_continuous on; #连续模式。
        #       hls_cleanup on; #对多余的切片进行删除。
        #       hls_nested on; #嵌套模式。
            # enable live streaming
            live on;
            meta on;
            
             # 低延迟配置
            wait_key on;
            wait_video on;
            idle_streams off;

            # HLS disabled: HLS segment writing can cause RTMP publish failures
            # hls on;
            # hls_path /tmp/hls;
            # hls_fragment 1s;
            # hls_playlist_length 3s;


            # record first 1K of stream
            # record all;
            # record_path av;
            # record_max_size 1K;

            # append current timestamp to each flv
            # record_unique on;

            # publish only from localhost
            # allow publish all;
            #deny publish none;

            # allow play all;

        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /data/cwaiuserdata/log/logs/nginx_access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
