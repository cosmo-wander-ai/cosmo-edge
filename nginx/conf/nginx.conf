

user  root;
worker_processes  auto;

error_log  @COSMO_DATA_DIR@/log/logs/nginx_error.log warn;
pid        nginx.pid;


events {
    worker_connections  35535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    client_body_temp_path @COSMO_DATA_DIR@/tmp/nginx_body 1 2;
    proxy_temp_path       @COSMO_DATA_DIR@/tmp/nginx_proxy;
    fastcgi_temp_path     @COSMO_DATA_DIR@/tmp/nginx_fastcgi;
    uwsgi_temp_path       @COSMO_DATA_DIR@/tmp/nginx_uwsgi;
    scgi_temp_path        @COSMO_DATA_DIR@/tmp/nginx_scgi;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  @COSMO_DATA_DIR@/log/logs/nginx_access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
