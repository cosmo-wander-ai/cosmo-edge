<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="blueA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="tealA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="greenA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #F5F7FA; }
      .panel { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; filter: url(#softShadow); }
      .sidebar { fill: #172233; }
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0F172A; }
      .label { font: 600 20px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .desc { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #64748B; }
      .brandLight { font: 700 26px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #F8FAFC; }
      .brandDark { font: 700 26px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0F172A; }
      .small { font: 500 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text x="52" y="64" class="title">边缘智能中枢 Logo 备选</text>
  <text x="52" y="94" class="desc">低风险替换：图标保持 32x32 量级，适配当前深色侧边栏，避免复杂细节。</text>

  <!-- Option A -->
  <g transform="translate(52,130)">
    <rect class="panel" width="520" height="170" rx="12"/>
    <text x="28" y="42" class="label">A. Edge Streams</text>
    <text x="28" y="68" class="desc">保留现有“三道斜线”记忆点，更工业、更锐利。</text>
    <g transform="translate(32,94)">
      <rect class="sidebar" width="250" height="54" rx="8"/>
      <g transform="translate(18,12)">
        <rect x="0" y="9" width="8" height="30" rx="4" transform="rotate(30 4 24)" fill="url(#blueA)"/>
        <rect x="16" y="2" width="8" height="37" rx="4" transform="rotate(30 20 20.5)" fill="#60A5FA"/>
        <rect x="32" y="9" width="8" height="30" rx="4" transform="rotate(30 36 24)" fill="url(#tealA)"/>
        <circle cx="51" cy="32" r="5.5" fill="#2DD4BF"/>
      </g>
      <text x="88" y="35" class="brandLight">边缘智能中枢</text>
    </g>
  </g>

  <!-- Option B -->
  <g transform="translate(628,130)">
    <rect class="panel" width="520" height="170" rx="12"/>
    <text x="28" y="42" class="label">B. Edge Node</text>
    <text x="28" y="68" class="desc">节点 + 边缘链路，更像边缘设备和 Pipeline。</text>
    <g transform="translate(32,94)">
      <rect class="sidebar" width="250" height="54" rx="8"/>
      <g transform="translate(16,11)">
        <path d="M8 28 L23 7 L47 7 L32 28 Z" fill="none" stroke="url(#blueA)" stroke-width="6" stroke-linejoin="round"/>
        <path d="M23 7 L32 28 L50 28" fill="none" stroke="url(#tealA)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="8" cy="28" r="4.5" fill="#38BDF8"/>
        <circle cx="50" cy="28" r="4.5" fill="#2DD4BF"/>
      </g>
      <text x="88" y="35" class="brandLight">边缘智能中枢</text>
    </g>
  </g>

  <!-- Option C -->
  <g transform="translate(52,340)">
    <rect class="panel" width="520" height="170" rx="12"/>
    <text x="28" y="42" class="label">C. Vision Core</text>
    <text x="28" y="68" class="desc">视觉检测框 + 中枢点，业务含义最直观。</text>
    <g transform="translate(32,94)">
      <rect class="sidebar" width="250" height="54" rx="8"/>
      <g transform="translate(18,11)">
        <path d="M6 6 H25 M6 6 V25 M50 6 H31 M50 6 V25 M6 50 V31 M6 50 H25 M50 50 H31 M50 50 V31" fill="none" stroke="url(#blueA)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="28" cy="28" r="8" fill="none" stroke="#2DD4BF" stroke-width="5"/>
        <circle cx="28" cy="28" r="3" fill="#2DD4BF"/>
      </g>
      <text x="88" y="35" class="brandLight">边缘智能中枢</text>
    </g>
  </g>

  <!-- Option D -->
  <g transform="translate(628,340)">
    <rect class="panel" width="520" height="170" rx="12"/>
    <text x="28" y="42" class="label">D. Pipeline Mark</text>
    <text x="28" y="68" class="desc">输入、推理、输出三段式，适合强调流程编排。</text>
    <g transform="translate(32,94)">
      <rect class="sidebar" width="250" height="54" rx="8"/>
      <g transform="translate(18,13)">
        <rect x="0" y="10" width="12" height="12" rx="3" fill="#38BDF8"/>
        <rect x="24" y="10" width="12" height="12" rx="3" fill="#60A5FA"/>
        <rect x="48" y="10" width="12" height="12" rx="3" fill="#2DD4BF"/>
        <path d="M13 16 H23 M37 16 H47" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
        <path d="M6 32 C20 40, 40 40, 54 32" fill="none" stroke="url(#tealA)" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="88" y="35" class="brandLight">边缘智能中枢</text>
    </g>
  </g>

  <!-- Small-size check -->
  <g transform="translate(52,570)">
    <rect class="panel" width="1096" height="120" rx="12"/>
    <text x="28" y="40" class="label">小尺寸可读性检查</text>
    <text x="28" y="68" class="desc">左侧为 32px 近似实际导航尺寸；推荐优先 A 或 C。</text>
    <g transform="translate(420,42) scale(.62)">
      <rect x="0" y="9" width="8" height="30" rx="4" transform="rotate(30 4 24)" fill="url(#blueA)"/>
      <rect x="16" y="2" width="8" height="37" rx="4" transform="rotate(30 20 20.5)" fill="#60A5FA"/>
      <rect x="32" y="9" width="8" height="30" rx="4" transform="rotate(30 36 24)" fill="url(#tealA)"/>
      <circle cx="51" cy="32" r="5.5" fill="#2DD4BF"/>
    </g>
    <g transform="translate(520,40) scale(.62)">
      <path d="M8 28 L23 7 L47 7 L32 28 Z" fill="none" stroke="url(#blueA)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M23 7 L32 28 L50 28" fill="none" stroke="url(#tealA)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="28" r="4.5" fill="#38BDF8"/>
      <circle cx="50" cy="28" r="4.5" fill="#2DD4BF"/>
    </g>
    <g transform="translate(620,38) scale(.62)">
      <path d="M6 6 H25 M6 6 V25 M50 6 H31 M50 6 V25 M6 50 V31 M6 50 H25 M50 50 H31 M50 50 V31" fill="none" stroke="url(#blueA)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="8" fill="none" stroke="#2DD4BF" stroke-width="5"/>
      <circle cx="28" cy="28" r="3" fill="#2DD4BF"/>
    </g>
    <g transform="translate(720,42) scale(.62)">
      <rect x="0" y="10" width="12" height="12" rx="3" fill="#38BDF8"/>
      <rect x="24" y="10" width="12" height="12" rx="3" fill="#60A5FA"/>
      <rect x="48" y="10" width="12" height="12" rx="3" fill="#2DD4BF"/>
      <path d="M13 16 H23 M37 16 H47" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
      <path d="M6 32 C20 40, 40 40, 54 32" fill="none" stroke="url(#tealA)" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="415" y="100" class="small">A</text>
    <text x="515" y="100" class="small">B</text>
    <text x="615" y="100" class="small">C</text>
    <text x="715" y="100" class="small">D</text>
  </g>
</svg>
