<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>边缘智能中枢 Logo 备选</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #0f172a;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 32px;
    }
    p {
      margin: 0 0 24px;
      color: #64748b;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
    }
    .name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .note {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .sidebar-preview {
      width: 284px;
      height: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-radius: 8px;
      background: #172233;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .light-preview {
      width: 284px;
      height: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #0f172a;
      box-sizing: border-box;
      margin-top: 10px;
    }
    .mark {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
    }
    .brand {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>边缘智能中枢 Logo 备选</h1>
    <p>按当前侧边栏尺寸设计，优先保证 32px 左右的小尺寸识别度。</p>
    <div class="grid">
      <section class="card">
        <div class="name">A. Edge Streams</div>
        <div class="note">最接近现有标识，替换风险最低。</div>
        <div class="sidebar-preview">
          <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
            <defs><linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient><linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2DD4BF"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient></defs>
            <rect x="10" y="22" width="8" height="30" rx="4" transform="rotate(30 14 37)" fill="url(#a1)"/>
            <rect x="27" y="12" width="8" height="40" rx="4" transform="rotate(30 31 32)" fill="#60A5FA"/>
            <rect x="44" y="22" width="8" height="30" rx="4" transform="rotate(30 48 37)" fill="url(#a2)"/>
            <circle cx="54" cy="46" r="6" fill="#2DD4BF"/>
          </svg>
          <div class="brand">边缘智能中枢</div>
        </div>
      </section>

      <section class="card">
        <div class="name">B. Edge Node</div>
        <div class="note">节点和链路感强，偏工程/边缘设备。</div>
        <div class="sidebar-preview">
          <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
            <defs><linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient><linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2DD4BF"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient></defs>
            <path d="M10 42 L27 17 L52 17 L36 42 Z" fill="none" stroke="url(#b1)" stroke-width="7" stroke-linejoin="round"/>
            <path d="M27 17 L36 42 L55 42" fill="none" stroke="url(#b2)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="42" r="5" fill="#38BDF8"/>
            <circle cx="55" cy="42" r="5" fill="#2DD4BF"/>
          </svg>
          <div class="brand">边缘智能中枢</div>
        </div>
      </section>

      <section class="card">
        <div class="name">C. Vision Core</div>
        <div class="note">视觉检测框 + 中枢点，业务含义最清楚。</div>
        <div class="sidebar-preview">
          <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
            <defs><linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
            <path d="M11 11 H28 M11 11 V28 M53 11 H36 M53 11 V28 M11 53 V36 M11 53 H28 M53 53 H36 M53 53 V36" fill="none" stroke="url(#c1)" stroke-width="6" stroke-linecap="round"/>
            <circle cx="32" cy="32" r="9" fill="none" stroke="#2DD4BF" stroke-width="6"/>
            <circle cx="32" cy="32" r="3.5" fill="#2DD4BF"/>
          </svg>
          <div class="brand">边缘智能中枢</div>
        </div>
      </section>

      <section class="card">
        <div class="name">D. Pipeline Mark</div>
        <div class="note">突出 Pipeline 编排，但小尺寸下识别略弱。</div>
        <div class="sidebar-preview">
          <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
            <defs><linearGradient id="d1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2DD4BF"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient></defs>
            <rect x="6" y="20" width="13" height="13" rx="3" fill="#38BDF8"/>
            <rect x="26" y="20" width="13" height="13" rx="3" fill="#60A5FA"/>
            <rect x="46" y="20" width="13" height="13" rx="3" fill="#2DD4BF"/>
            <path d="M20 26.5 H25 M40 26.5 H45" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
            <path d="M12 43 C24 51, 42 51, 54 43" fill="none" stroke="url(#d1)" stroke-width="6" stroke-linecap="round"/>
          </svg>
          <div class="brand">边缘智能中枢</div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
